# Mapeamento de caminhos para sincronização com o upstream (storytold/gridcraft)
#
# Cada entrada traduz um caminho do upstream para o caminho neste repo.
# Arquivos ausentes deste mapa = "não tentar aplicar automaticamente".
# Baseline: gridcraft v0.16.1 = e581bc95.
#
# strategy:
#   apply   - o script tenta aplicar via git diff/apply sem revisão de conteúdo
#   review  - o script baixa o diff, mas um humano deve revisar antes de aplicar
#   skip    - o script ignora este arquivo (conflito garantido ou escopo diferente)

[[map]]
upstream = "crates/xlsx/**"
local = "crates/xlsx/**"
strategy = "review"
note = "leitura/escrita XLSX, XLSB e ODS; paridade com Excel, mas confira o corpus e os testes de round-trip"

[[map]]
upstream = "crates/calc/**"
local = "crates/calc/**"
strategy = "apply"
note = "grafo de dependências e avaliador; sem marca, mas exige revisão das invariantes de undo"

[[map]]
upstream = "crates/engine/src/cmd/**"
local = "crates/engine/src/cmd/**"
strategy = "review"
note = "comandos; ids e rótulos são parte do contrato do CLI, control channel e MCP"

[[map]]
upstream = "crates/engine/src/io.rs"
local = "crates/engine/src/io.rs"
strategy = "apply"
note = "save atômico/recovery, sem marca nem dep"

[[map]]
upstream = "crates/formula/**"
local = "crates/formula/**"
strategy = "review"
note = "lexer/parser/printer; a semântica de referências é observada, não copiada"

[[map]]
upstream = "crates/functions/**"
local = "crates/functions/**"
strategy = "review"
note = "biblioteca de funções; regressões aqui mexem em números do usuário"

[[map]]
upstream = "crates/numfmt/**"
local = "crates/numfmt/**"
strategy = "review"
note = "linguagem de formato numérico; paridade com Excel exige teste dedicado"

[[map]]
upstream = "crates/model/**"
local = "crates/model/**"
strategy = "apply"
note = "workbook, células copy-on-write, estilos; sem marca"

[[map]]
upstream = "crates/chart/**"
local = "crates/chart/**"
strategy = "apply"
note = "layout e renderização de gráficos sem toolkit"

[[map]]
upstream = "crates/pdf/**"
local = "crates/pdf/**"
strategy = "review"
note = "escritor PDF 1.7 próprio; se o upstream trocar por craft-pdf, parar e decidir (nosso é sem deps)"

[[map]]
upstream = "crates/ui-egui/src/lib.rs"
local = "crates/ui-egui/src/lib.rs"
strategy = "review"
note = "UPDATE_APP aponta para suite::LOCALSHEETS; um merge cego devolveria o app do upstream"

[[map]]
upstream = "Cargo.toml"
local = "Cargo.toml"
strategy = "skip"
note = "nomes de crate localsheets-*, path deps em libs/, [patch.crates-io] e edition 2024"

[[map]]
upstream = "apps/gridcraft/**"
local = "apps/localsheets/**"
strategy = "skip"
note = "binário/identidade renomeados; o entry point tem diferenças de rebrand"

[[map]]
upstream = "apps/gridcraft-cli/**"
local = "apps/localsheets-cli/**"
strategy = "skip"
note = "CLI renomeada e com links próprios"

[[map]]
upstream = "apps/gridcraft-web/**"
local = "apps/localsheets-web/**"
strategy = "skip"
note = "wasm renomeado"

[[map]]
upstream = "packaging/**"
local = "packaging/**"
strategy = "skip"
note = "nosso packaging é o molde da suíte (WiX per-machine/per-user, nfpm próprios)"

[[map]]
upstream = ".github/**"
local = ".github/**"
strategy = "skip"
note = "nosso CI é próprio; não puxar workflows da org storytold"

[[map]]
upstream = "docs/brand/**"
local = "docs/brand/**"
strategy = "skip"
note = "marca ArtCraft; removida no rebrand (diretório não existe mais aqui)"

[[map]]
upstream = "docs/**"
local = "docs/**"
strategy = "review"
note = "docs de paridade acompanham features; README, ROADMAP, NOTICE, ATTRIBUTION e upstream-sync são nossos"

[[map]]
upstream = "ROADMAP.md"
local = "ROADMAP.md"
strategy = "skip"
note = "roadmap do GridCraft; o nosso evolui separado"

[[map]]
upstream = "contributors/**"
local = "contributors/**"
strategy = "skip"
note = "contributors.json é gerado; people.toml é local"

[[map]]
upstream = "assets/app-icon/**"
local = "assets/app-icon/**"
strategy = "skip"
note = "ícone próprio da suíte (Fase C), não o placeholder do upstream"
