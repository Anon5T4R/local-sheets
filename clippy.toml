allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# The app reads the clock through the crate's own helpers (`crate::clock::now_ms` and
# `monotonic_ms`), so screenshot deadlines, autosave pacing and tests share one source. A direct
# `Instant::now`/`SystemTime::now` is a deliberate exception: allow the lint at that call.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "read the clock through crate::clock; allow the lint at a deliberate exception" },
    { path = "std::time::SystemTime::now", reason = "read the clock through crate::clock; allow the lint at a deliberate exception" },
]

disallowed-types = [
    { path = "egui::ComboBox", reason = "use craft_ui::ComboBox: egui's combo box menu can't grow back while open (egui#5225)" },
]
cognitive-complexity-threshold = 30
