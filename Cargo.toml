[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# libs/ holds the vendored forks (egui, winit, craft-libs, winprint.rs): read-only third-party
# trees, built through the path dependencies and [patch.crates-io] below, never part of this
# workspace.
exclude = ["libs"]
default-members = ["crates/*", "apps/localsheets", "apps/localsheets-cli", "xtask"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/local-sheets"

[workspace.dependencies]
# internal
localsheets-core = { path = "crates/core" }
localsheets-numfmt = { path = "crates/numfmt" }
localsheets-formula = { path = "crates/formula" }
localsheets-functions = { path = "crates/functions" }
localsheets-model = { path = "crates/model" }
localsheets-calc = { path = "crates/calc" }
localsheets-xlsx = { path = "crates/xlsx" }
localsheets-chart = { path = "crates/chart" }
localsheets-engine = { path = "crates/engine" }
localsheets-ui-egui = { path = "crates/ui-egui" }
localsheets-mcp = { path = "crates/mcp" }
localsheets-pdf = { path = "crates/pdf" }
localsheets-math = { path = "crates/math" }
# Every craft-libs crate (craft-update and craft-window here, craft-ui in ui-egui, craft-print in
# the app) comes from the one vendored craft-libs tree (c5a1cbf): path dependencies, since the CI
# rejects git sources.
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { path = "libs/craft-libs/crates/update/", version = "=0.1.0", features = ["egui"] }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
web-time = "1.1.0"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
# Decrypting password-protected workbooks ([MS-OFFCRYPTO]): AES and SHA-1, pure Rust (wasm-safe).
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# equations: RaTeX (MIT) lays LaTeX out as positioned glyphs, rules and paths. Exact pins: it is
# young (0.1.x), and the gate recorded in docs/decisions.md vetted this release.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
# The desktop's preferred language, for the first-run interface language (native only).
sys-locale = "0.3"
# Font parser egui's epaint uses; the UI validates system font files with it before handing them
# to egui, which panics on a file it can't parse. Same version as epaint's, so no second copy.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Real font bytes for tests (Ubuntu Light, compiled into epaint).
epaint_default_fonts = "0.37"
# One native window per workbook: the window list, Window menu titles and the immediate-viewport
# driver. Same vendored craft-libs tree as craft-update above.
craft-window = { path = "libs/craft-libs/crates/window/", version = "0.1.0", default-features = false, features = ["egui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# The egui and winit crates resolve from the vendored forks under libs/ (path sources; egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
# // local-sheets: fork do rustls-rustcrypto (experimento TLS puro do updater).
# O upstream 0.0.2-alpha puxa rustls-webpki 0.102 só pelas constantes `alg_id`;
# o fork usa `rustls-pki-types` e some com os advisories (README no próprio fork).
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }
