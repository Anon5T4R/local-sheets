[package]
name = "localsheets-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Sheets egui frontend (Excel-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
# The shared capture slot (`craft_ui::capture`) comes from the one vendored craft-libs tree every
# craft-libs dependency uses (see the root Cargo.toml).
craft-ui = { path = "../../libs/craft-libs/crates/ui/" }
# The suite's AI surface: the connections form, the status strip and the chat panel (shared with
# the other apps); this crate keeps the prompts, the context and the apply.
craft-ai-ui = { workspace = true }
craft-icons = { workspace = true }
egui_extras = { workspace = true }
localsheets-engine = { workspace = true }
localsheets-chart = { workspace = true }
localsheets-ai = { workspace = true }
# `monochrome_emoji_fonts` restores the Noto Emoji and emoji-icon faces that 0.37 moved behind
# this feature. The UI draws ✕, ◀, ↘ and 📋 as text; without these faces the strict kittest
# harness (and a host with no symbol font) renders them as tofu.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
skrifa = { workspace = true }
web-time = { workspace = true }
craft-update = { workspace = true }
# The desktop's preferred language for the first-run interface language.
sys-locale = { workspace = true }
craft-window = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
epaint_default_fonts = { workspace = true }
localsheets-xlsx = { workspace = true, features = ["test-support"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
